<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="VoltMeter Pro digital multimeter">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#fdeccc"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="40%" r="58%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".38"/><stop offset=".65" stop-color="#f59e0b" stop-opacity=".10"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#dfe8f7"/><stop offset="1" stop-color="#b9cbe6"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity=".92"/><stop offset=".55" stop-color="#0a1b33"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".55"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#c3d3ea"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0a1b33" flood-opacity=".22"/></filter>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<rect width="800" height="800" fill="url(#glow)"/>
<g stroke="#0a1b33" stroke-opacity=".06" stroke-width="2">
<path d="M0 200H800M0 400H800M0 600H800M200 0V800M400 0V800M600 0V800"/>
</g>
<ellipse cx="400" cy="672" rx="215" ry="26" fill="#0a1b33" opacity=".14" filter="url(#soft)"/>
<g filter="url(#shadow)">
<rect x="268" y="196" width="264" height="410" rx="42" fill="url(#body)" stroke="#9fb6d6" stroke-width="2"/>
<circle cx="400" cy="400" r="112" fill="#0a1b33" opacity=".92"/>
<circle cx="400" cy="400" r="112" fill="none" stroke="#f59e0b" stroke-width="4" opacity=".7"/>
