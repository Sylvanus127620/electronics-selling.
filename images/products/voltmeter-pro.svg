<line x1="400" y1="400" x2="400" y2="300" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" transform="rotate(38 400 400)"/>
<circle cx="400" cy="400" r="12" fill="#f59e0b"/>
<text x="400" y="540" font-family="Segoe UI,Arial" font-size="42" font-weight="700" fill="#0a1b33" opacity=".8" text-anchor="middle">True RMS</text>
<rect x="300" y="238" width="200" height="18" rx="9" fill="#fff" opacity=".6"/>
