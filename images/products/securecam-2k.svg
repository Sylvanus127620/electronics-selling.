<rect x="256" y="238" width="288" height="230" rx="70" fill="url(#body)" stroke="#9fb6d6" stroke-width="2"/>
<circle cx="400" cy="352" r="96" fill="#0a1b33" opacity=".92"/>
<circle cx="400" cy="352" r="72" fill="url(#screen)"/>
<circle cx="400" cy="352" r="38" fill="#0a1b33"/>
<circle cx="374" cy="326" r="12" fill="#fff" opacity=".6"/>
<circle cx="400" cy="352" r="96" fill="none" stroke="#0f172a" stroke-width="5" opacity=".8"/>
